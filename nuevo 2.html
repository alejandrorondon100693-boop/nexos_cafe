      { id: 'fria-merengada-oreo', name: 'Merengada Oreo', category: 'Cafés y Bebidas Frías', desc: 'Merengada con galletas Oreo.', image: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=600&q=80', variants: [{ label: '300 ml', price: 4.50 }, { label: '500 ml', price: 6.50 }] },

      { id: 'fria-tes-infusiones', name: 'Tés Fríos e infusiones', category: 'Cafés y Bebidas Frías', desc: 'Té negro frío con Limón, Té verde Frío con Limón, Infusión Flor de Jamaica fría con Limón o con Canela y limón.', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Frío', price: 2.70 }] },
      { id: 'fria-rosa-negra', name: 'Rosa negra', category: 'Cafés y Bebidas Frías', desc: 'Té negro, jamaica, guayabita, pimienta negra y sarrapia.', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Fría', price: 2.70 }] },
      { id: 'fria-fusion-verde', name: 'Fusión Verde Fría', category: 'Cafés y Bebidas Frías', desc: 'Té verde, jengibre, yerbabuena, y limón.', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Fría', price: 2.70 }] },
      { id: 'fria-tisana-spicata', name: 'Tisana Fría Flor Spicata', category: 'Cafés y Bebidas Frías', desc: 'Flor de jamaica, jengibre, limón y yerbabuena.', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Fría', price: 2.70 }] },
      { id: 'fria-tes-chais', name: 'Tés Chais Fríos', category: 'Cafés y Bebidas Frías', desc: 'Variedad de chai servido frío.', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Frío', price: 2.70 }] },

      { id: 'ext-postres', name: 'Postres y tortas', category: 'Postres, Salados y Grano', desc: 'Opciones dulces y tortas artesanales de la carta Nexos.', image: 'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-postres-frios', name: 'Tortas y postres fríos', category: 'Postres, Salados y Grano', desc: 'Alternativas frías de repostería.', image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-galletas', name: 'Galletas', category: 'Postres, Salados y Grano', desc: 'Galletas recién horneadas para acompañar tu café.', image: 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-pizzas', name: 'Pizzas', category: 'Postres, Salados y Grano', desc: 'Alternativa salada de la casa.', image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-tequenos', name: 'Tequeños', category: 'Postres, Salados y Grano', desc: 'Pasapalo salado clásico.', image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-medialunas', name: 'Media Lunas rellenas', category: 'Postres, Salados y Grano', desc: 'Media lunas rellenas para acompañar.', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-desayunos', name: 'Desayunos', category: 'Postres, Salados y Grano', desc: 'Opciones de desayuno desde las 8:30 a.m.', image: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=600&q=80', variants: [{ label: 'Consultar disponibilidad/precio', price: null }] },
      { id: 'ext-grano-molido', name: 'Café Nexos Molido / en Grano', category: 'Postres, Salados y Grano', desc: 'Presentaciones disponibles: 250 g, 500 g y 1 Kg (Café Molido o Café en Grano).', image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=600&q=80', variants: [{ label: '250 g (Consultar precio)', price: null }, { label: '500 g (Consultar precio)', price: null }, { label: '1 Kg (Consultar precio)', price: null }] }
    ];

    const categories = ['Todos', 'Cafés Clásicos', 'Cafés Especiales', 'Filtrados', 'Bebidas Calientes', 'Cafés y Bebidas Frías', 'Postres, Salados y Grano'];
    let activeCategory = 'Todos';
    let searchQuery = '';
    let cart = [];
    let orderMode = 'Consumo en el lugar';
    const selectedIngredients = new Set();
    let isBrewing = false;
    let lastCustomDrink = null;

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      if (!container) return;
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = cat === activeCategory;
        btn.className = `px-4 py-2 rounded-full text-xs font-mono uppercase tracking-wider border transition-all ${
          isActive ? 'bg-nexos-copper text-nexos-bg border-nexos-copper font-semibold' : 'bg-nexos-surface text-nexos-muted border-nexos-border hover:text-nexos-text'
        }`;
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderCategoryTabs();
          renderMenuGrid();
        });
        container.appendChild(btn);
      });
    }

    function formatPriceSummary(variants) {
      const priced = variants.filter(v => typeof v.price === 'number');
      if (priced.length === 0) return 'Consultar';
      if (priced.length === 1) return `$${priced[0].price.toFixed(2)}`;
      return priced.map(v => `$${v.price.toFixed(2)}`).join(' / ');
    }

    function renderMenuGrid() {
      const grid = document.getElementById('menu-grid');
      const emptyBox = document.getElementById('menu-empty');
      if (!grid) return;

      const filtered = menuItems.filter(item => {
        const matchesCat = activeCategory === 'Todos' || item.category === activeCategory;
        const matchesQuery = !searchQuery ||
          item.name.toLowerCase().includes(searchQuery) ||
          item.desc.toLowerCase().includes(searchQuery) ||
          item.category.toLowerCase().includes(searchQuery);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        if (emptyBox) emptyBox.classList.remove('hidden');
        return;
      }

      if (emptyBox) emptyBox.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const hasMultipleVariants = item.variants.length > 1;
        const defaultVariant = item.variants[0];
        const variantControls = hasMultipleVariants
          ? `<select id="var-${escapeAttr(item.id)}" class="w-full mb-3 bg-nexos-bg border border-nexos-border focus:border-nexos-copper rounded-xl px-3 py-2 text-xs text-nexos-text outline-none">${
              item.variants.map((v, idx) => `<option value="${idx}">${escapeAttr(v.label)}${typeof v.price === 'number' ? ` — $${v.price.toFixed(2)}` : ''}</option>`).join('')
            }</select>`
          : `<div class="font-mono text-[11px] text-nexos-muted mb-3">${escapeAttr(defaultVariant.label)}</div>`;

        return `
          <article class="bg-nexos-surface hover:bg-nexos-surfaceHover border border-nexos-border rounded-2xl overflow-hidden flex flex-col justify-between transition-all group">
            <div>
              <div class="relative h-40 bg-nexos-bg overflow-hidden border-b border-nexos-border">
                <img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.name)}" loading="lazy" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-500" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <div class="hidden w-full h-full items-center justify-center bg-gradient-to-br from-[#231F1C] to-[#12100E] text-nexos-copper font-serif text-3xl">Nexos</div>
                <span class="absolute top-3 left-3 font-mono text-[10px] uppercase tracking-widest px-2.5 py-1 rounded-md bg-nexos-bg/85 border border-nexos-border text-nexos-gold">${escapeAttr(item.category)}</span>
              </div>
              <div class="p-5">
                <div class="flex items-start justify-between gap-3 mb-2">
                  <h3 class="font-serif text-2xl text-nexos-text group-hover:text-nexos-gold transition-colors leading-snug">${escapeAttr(item.name)}</h3>
                  <span class="font-mono text-sm font-semibold text-nexos-gold shrink-0 pt-1">${formatPriceSummary(item.variants)}</span>
                </div>
                <p class="text-xs text-nexos-muted leading-relaxed">${escapeAttr(item.desc)}</p>
              </div>
            </div>
            <div class="px-5 pb-5 pt-2">
              ${variantControls}
              <button type="button" data-add-item="${escapeAttr(item.id)}" class="w-full py-2.5 px-4 rounded-xl bg-nexos-bg hover:bg-nexos-copper text-nexos-text hover:text-nexos-bg border border-nexos-border hover:border-nexos-copper text-xs font-medium transition-all">
                ${typeof defaultVariant.price === 'number' || hasMultipleVariants ? '+ Agregar' : '+ Consultar por WhatsApp'}
              </button>
            </div>
          </article>
        `;
      }).join('');

      grid.querySelectorAll('[data-add-item]').forEach(btn => {
        btn.addEventListener('click', () => handleAddMenuItem(btn.getAttribute('data-add-item')));
      });
    }

    function handleAddMenuItem(itemId) {
      const item = menuItems.find(m => m.id === itemId);
      if (!item) return;
      const selectEl = document.getElementById(`var-${item.id}`);
      const variantIndex = selectEl ? parseInt(selectEl.value, 10) : 0;
      const chosen = item.variants[variantIndex] || item.variants[0];
      const displayName = item.variants.length > 1 ? `${item.name} (${chosen.label})` : item.name;
      addToCart(`${item.id}-${variantIndex}`, displayName, chosen.price);
    }

    function addToCart(id, name, price) {
      const numericPrice = typeof price === 'number' ? price : null;
      const existing = cart.find(c => c.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ id, name, price: numericPrice, qty: 1 });
      renderCartUI();
      showToast(`Añadido: ${name}`);
    }

    function updateCartQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
      renderCartUI();
    }

    function clearCart() {
      cart = [];
      renderCartUI();
      showToast('Selección vaciada');
    }

    function setOrderMode(mode) {
      orderMode = mode;
      const btnLocal = document.getElementById('mode-local');
      const btnLlevar = document.getElementById('mode-llevar');
      if (!btnLocal || !btnLlevar) return;
      if (mode === 'Consumo en el lugar') {
        btnLocal.className = 'py-2 px-2.5 rounded-xl text-xs font-medium bg-nexos-copper text-nexos-bg transition-all';
        btnLlevar.className = 'py-2 px-2.5 rounded-xl text-xs font-medium bg-nexos-bg border border-nexos-border text-nexos-muted hover:text-nexos-text transition-all';
      } else {
        btnLlevar.className = 'py-2 px-2.5 rounded-xl text-xs font-medium bg-nexos-copper text-nexos-bg transition-all';
        btnLocal.className = 'py-2 px-2.5 rounded-xl text-xs font-medium bg-nexos-bg border border-nexos-border text-nexos-muted hover:text-nexos-text transition-all';
      }
    }

    function renderCartUI() {
      const listEl = document.getElementById('cart-items-list');
      const headerBadge = document.getElementById('header-cart-count');
      const sidebarBadge = document.getElementById('sidebar-badge');
      const totalEl = document.getElementById('cart-total-amount');
      const submitBtn = document.getElementById('whatsapp-submit-btn');
      const clearBtn = document.getElementById('clear-cart-btn');
      if (!listEl) return;

      const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (typeof i.price === 'number' ? i.price * i.qty : 0), 0);
      const hasConsultItems = cart.some(i => typeof i.price !== 'number');

      if (headerBadge) headerBadge.textContent = totalQty;
      if (sidebarBadge) sidebarBadge.textContent = `${totalQty} ${totalQty === 1 ? 'ítem' : 'ítems'}`;
      if (totalEl) totalEl.textContent = hasConsultItems ? `$${totalPrice.toFixed(2)} + cons.` : `$${totalPrice.toFixed(2)}`;

      if (cart.length === 0) {
        if (submitBtn) submitBtn.disabled = true;
        if (clearBtn) clearBtn.classList.add('hidden');
        listEl.innerHTML = `<p class="text-xs text-nexos-muted py-6 text-center bg-nexos-bg/60 rounded-xl border border-nexos-border/60">Aún no has agregado productos del catálogo o del Laboratorio Barista.</p>`;
        return;
      }

      if (submitBtn) submitBtn.disabled = false;
      if (clearBtn) clearBtn.classList.remove('hidden');

      listEl.innerHTML = cart.map(item => `
        <div class="p-3 rounded-xl bg-nexos-bg border border-nexos-border flex items-center justify-between gap-2.5">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-medium text-nexos-text truncate">${escapeAttr(item.name)}</div>
            <div class="font-mono text-[11px] text-nexos-gold">${typeof item.price === 'number' ? `$${(item.price * item.qty).toFixed(2)}` : 'Consultar precio'}</div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" onclick="updateCartQty('${escapeAttr(item.id)}', -1)" class="w-6 h-6 rounded-md bg-nexos-surface border border-nexos-border text-nexos-text text-xs">−</button>
            <span class="font-mono text-xs w-4 text-center">${item.qty}</span>
            <button type="button" onclick="updateCartQty('${escapeAttr(item.id)}', 1)" class="w-6 h-6 rounded-md bg-nexos-surface border border-nexos-border text-nexos-text text-xs">+</button>
          </div>
        </div>
      `).join('');
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) return;
      const paymentMethod = document.getElementById('order-payment-method').value;
      const notes = document.getElementById('order-notes').value.trim();
      let total = 0;
      let hasConsultItems = false;

      const itemsText = cart.map(item => {
        if (typeof item.price === 'number') {
          const sub = item.price * item.qty;
          total += sub;
          return `• ${item.qty}x ${item.name} — $${sub.toFixed(2)}`;
        }
        hasConsultItems = true;
        return `• ${item.qty}x ${item.name} — Consultar precio`;
      }).join('\n');

      let msg = `Hola *Nexos Café* (Av. 5 entre calles 16 y 17, Mérida), quisiera realizar el siguiente pedido:\n\n*Modalidad:* ${orderMode}\n*Método de Pago:* ${paymentMethod}\n\n*Detalle del Pedido:*\n${itemsText}\n\n*Subtotal Estimado:* $${total.toFixed(2)}${hasConsultItems ? ' (más ítems por consultar)' : ''}`;
      if (notes) msg += `\n*Notas:* ${notes}`;
      window.open(`https://wa.me/584120744298?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
    }

    function initCatalog() {
      renderCategoryTabs();
      renderMenuGrid();
      renderCartUI();
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));

      const searchInput = document.getElementById('menu-search');
      if (searchInput && !searchInput.dataset.bound) {
        searchInput.dataset.bound = '1';
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim().toLowerCase();
          renderMenuGrid();
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCatalog);
    } else {
      initCatalog();
    }
  </script>
